# A consumer project whose only purpose is to pin Apache Superset and its whole
# transitive closure into uv.lock, so that flake.nix can build the environment
# with no network access and no resolver.
#
# Superset is not in nixpkgs, and its own pins put it out of reach of what is:
# it wants SQLAlchemy 1.4, marshmallow 3, pandas 2.1, numpy < 2.3, pyarrow < 19
# and msgpack < 1.1, against nixpkgs' 2.0, 4.2, 2.3, 2.4, 23 and 1.1. Overriding
# that many python3Packages by hand is how this ends up unbuildable; locking the
# versions upstream tested against and building those is not.
[project]
name = "superset-env"
version = "0"
description = "Apache Superset, locked for a Nix build"
# Superset 6.1 accepts >= 3.10. Pinned to one minor so the lock resolves a
# single wheel per package rather than a range the builder would have to choose
# from at evaluation time.
requires-python = ">=3.11,<3.12"

dependencies = [
  # postgres: psycopg2-binary, the driver for both the metadata database and
  # the gosk/TimescaleDB one every chart reads.
  "apache-superset[postgres]==6.1.0",
  # superset/cli/test_db.py imports rich unconditionally, but 6.1 only declares
  # it under the development extra - so `superset --help` cannot even build its
  # command tree without it. Not our choice to make; upstream's omission.
  "rich",
  # Superset's own requirements never enable OAuth, so Flask-AppBuilder's
  # `oauth` extra - and therefore Authlib - is absent from them. Without it
  # AUTH_TYPE = AUTH_OAUTH dies at import with "No module named 'authlib'"
  # before the app is even built. The extra rather than a direct authlib pin,
  # so FAB's own bound (>=0.14,<2.0.0) is what applies.
  "flask-appbuilder[oauth]",
  # The async worker pool gunicorn runs. Superset's own docs use gevent for the
  # webserver; without it a long chart query blocks a whole worker.
  "gevent>=23.9.1",
]

[tool.uv]
package = false

# Superset's dependency *ranges* are not the versions Superset is tested with.
# Resolving them freshly picks Flask 3.1, flask-sqlalchemy 3.0 and cachelib 0.17
# where upstream CI runs Flask 2.3.3, flask-sqlalchemy 2.5.1 and cachelib 0.13 -
# and Superset does not survive that: `SupersetMetastoreCache.__init__() got an
# unexpected keyword argument 'ignore_delete_many_errors'` before the CLI can
# even build its command tree.
#
# So the resolver is held to the set upstream publishes in
# requirements/base.txt, copied verbatim into requirements/upstream-base.txt and
# flattened here. Constraints only narrow what is already selected, so entries
# for packages this build does not pull in are inert.
#
# Regenerating after a Superset bump: see `nix run .#update-pins`.
constraint-dependencies = [
